<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .heading1{
            color: red;
        }
        #heading_2{
            color: pink;
        }
        .heading2{
            color: blue;
        }
        h1{
            color: blueviolet;
        }        
        #welcome{
            color: brown;
        }
    </style>
</head>
<body>
    <h1>Welcome for class,ID</h1>
    <!-- Class selector -->
    <h1 class="heading1">This heading Class Example 1</h1>
    <h1 class="heading2">This heading Class Example 2</h1>

    <!-- Id selector -->
     <h2 id="heading_2">This is ID Example 1</h2>

     <h2 id="heading_2" class="heading2">This is ID Example 2</h2>

     <h6 id="welcome">Hi, Welcome Sir</h6>
</body>
</html>
